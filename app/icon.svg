<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F241A" />
      <stop offset="50%" stop-color="#1B3B2B" />
      <stop offset="100%" stop-color="#0A1811" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE8B2" />
      <stop offset="30%" stop-color="#E5C170" />
      <stop offset="70%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7B3E" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" />

  <!-- Center Decorative Mehendi Henna Flower & Sparkle -->
  <g transform="translate(256 256)">
    <!-- Outer Petal Rings -->
    <path d="M 0 -130 Q 30 -80 0 0 Q -30 -80 0 -130 Z" fill="url(#goldGrad)" />
    <path d="M 0 130 Q 30 80 0 0 Q -30 80 0 130 Z" fill="url(#goldGrad)" />
    <path d="M -130 0 Q -80 30 0 0 Q -80 -30 -130 0 Z" fill="url(#goldGrad)" />
    <path d="M 130 0 Q 80 30 0 0 Q 80 -30 130 0 Z" fill="url(#goldGrad)" />

    <!-- Diagonal Petals -->
    <path d="M -90 -90 Q -40 -70 0 0 Q -70 -40 -90 -90 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 90 -90 Q 40 -70 0 0 Q 70 -40 90 -90 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M -90 90 Q -40 70 0 0 Q -70 40 -90 90 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 90 90 Q 40 70 0 0 Q 70 40 90 90 Z" fill="url(#goldGrad)" opacity="0.85" />

    <!-- Center Sparkle Star -->
    <path d="M 0 -70 Q 15 -20 70 0 Q 15 20 0 70 Q -15 20 -70 0 Q -15 -20 0 -70 Z" fill="#FFFFFF" />
    <path d="M 0 -45 Q 10 -15 45 0 Q 10 15 0 45 Q -10 15 -45 0 Q -10 -15 0 -45 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="8" fill="#1B3B2B" />
  </g>
</svg>
